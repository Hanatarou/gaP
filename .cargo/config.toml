# Windows: link the C runtime statically so the .exe needs no Visual C++ Redistributable.
# (The target is chosen on the command line / by the workflow: x86_64-pc-windows-msvc or i686-pc-windows-msvc.)
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
